# PrimeMall 网关负载均衡：3 个本地实例
upstream shop_backend {
    # 在 Windows Docker Desktop 上，host.docker.internal 高并发时可能 DNS 抖动
    # 增加 keepalive 连接池来减少新建连接的开销
    keepalive 64;
    server host.docker.internal:9091 max_fails=5 fail_timeout=60s;
    server host.docker.internal:9092 max_fails=5 fail_timeout=60s;
    server host.docker.internal:9093 max_fails=5 fail_timeout=60s;
}

server {
    listen 8080;
    server_name localhost;

    # 请求头转发
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长连接（与 keepalive 配合）
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 超时配置
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # 缓冲
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;

    # 上游失败时重试其他实例（不重试幂等请求外的POST）
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_timeout 10s;
    proxy_next_upstream_tries 3;

    location / {
        proxy_pass http://shop_backend;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK";
    }
}
