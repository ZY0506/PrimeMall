# PrimeMall 网关负载均衡（Docker 版）
# 使用 Docker Compose 服务名代替 host.docker.internal
upstream shop_backend {
    keepalive 256;

    # 双实例负载均衡
    server shop-01:9091 max_fails=5 fail_timeout=60s;
    server shop-02:9092 max_fails=5 fail_timeout=60s;

    # 如需扩展更多实例，在此追加:
    # server shop-03:9093 max_fails=5 fail_timeout=60s;
}

server {
    listen 8080;
    server_name localhost;

    # 请求头转发
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长连接（与 keepalive 配合）
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 超时配置
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # 缓冲
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;

    # 上游失败时重试其他实例（不重试幂等请求外的 POST）
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_timeout 10s;
    proxy_next_upstream_tries 3;

    location / {
        proxy_pass http://shop_backend;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK";
    }
}
