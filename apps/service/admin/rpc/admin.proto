  int64 refund_amount = 14;
  string refund_time = 15;
  AdminOrderProductItem product_item = 16;
}

message AdminHandleAfterSaleReq {
  uint64 after_sale_id = 1;
  AfterSaleAuditAction action = 2;
  string remark = 3;
}


// =============================================
// 优惠券管理（AdminCoupon）
// =============================================

message AdminCreateCouponReq {
  string name = 1;
  AdminCouponType type = 2;
  int64 threshold_amount = 3;
  int64 reduce_amount = 4;
  int64 discount_rate = 5;
  int64 max_discount_amount = 6;
  int64 total_quantity = 7;
  int64 per_user_limit = 8;
  string start_time = 9;
  string end_time = 10;
  string description = 11;
}

message AdminUpdateCouponReq {
  uint64 id = 1;
  string name = 2;
  AdminCouponType type = 3;
  int64 threshold_amount = 4;
  int64 reduce_amount = 5;
  int64 discount_rate = 6;
  int64 max_discount_amount = 7;
  int64 total_quantity = 8;
  int64 per_user_limit = 9;
  string start_time = 10;
  string end_time = 11;
  string description = 12;
}

message AdminUpdateCouponStatusReq {
  uint64 id = 1;
  SwitchStatus status = 2;
}

message AdminCouponItem {
  uint64 id = 1;
  string name = 2;
  AdminCouponType type = 3;
  int64 total_quantity = 4;
  int64 used_quantity = 5;
  SwitchStatus status = 6;
  string start_time = 7;
  string end_time = 8;
}

message AdminListCouponsReq {
  int64 page = 1;
  int64 page_size = 2;
  SwitchStatus status = 3;
