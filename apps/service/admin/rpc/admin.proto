syntax = "proto3";

package admin;

option go_package = "./admin";

// goctl rpc protoc .\apps\service\admin\rpc\admin.proto --go_out=apps/service/admin/rpc/types --go-grpc_out apps/service/admin/rpc/types --zrpc_out=apps/service/admin/rpc/ -m


// =============================================
// 枚举定义
// =============================================

// 管理员状态
enum AdminStatus {
  ADMIN_STATUS_UNKNOWN = 0;
  ADMIN_STATUS_NORMAL  = 1;  // 正常
  ADMIN_STATUS_DISABLED = 2; // 禁用
}

// 通用开关状态
enum SwitchStatus {
  SWITCH_STATUS_UNKNOWN = 0;
  SWITCH_STATUS_ON      = 1; // 启用
  SWITCH_STATUS_OFF     = 2; // 禁用
}

// 日志模块枚举
enum LogModule {
  LOG_MODULE_UNKNOWN    = 0;
  LOG_MODULE_ADMIN      = 1; // 管理员管理
  LOG_MODULE_USER       = 2; // 用户管理
  LOG_MODULE_PRODUCT    = 3; // 商品管理
  LOG_MODULE_ORDER      = 4; // 订单管理
  LOG_MODULE_AFTERSALE  = 5; // 售后管理
  LOG_MODULE_COUPON     = 6; // 优惠券管理
  LOG_MODULE_CATEGORY   = 7; // 分类管理
  LOG_MODULE_FREIGHT    = 8; // 运费模板管理
  LOG_MODULE_ROLE       = 9; // 角色管理
  LOG_MODULE_PERMISSION = 10; // 权限管理
}

// 后台商品状态
enum AdminProductStatus {
  ADMIN_PRODUCT_STATUS_UNKNOWN  = 0;
  ADMIN_PRODUCT_STATUS_ON_SALE  = 1; // 上架
  ADMIN_PRODUCT_STATUS_OFF_SALE = 2; // 下架
}

// 后台订单状态
enum AdminOrderStatus {
  ADMIN_ORDER_STATUS_UNKNOWN     = 0;
  ADMIN_ORDER_STATUS_PENDING_PAY = 10; // 待支付
  ADMIN_ORDER_STATUS_PAID        = 20; // 已支付
  ADMIN_ORDER_STATUS_SHIPPED     = 30; // 已发货
  ADMIN_ORDER_STATUS_COMPLETED   = 40; // 已完成
  ADMIN_ORDER_STATUS_CANCELED    = 50; // 已取消
  ADMIN_ORDER_STATUS_AFTER_SALE  = 60; // 售后中
}

// 后台售后状态
enum AdminAfterSaleStatus {
  ADMIN_AFTER_SALE_STATUS_UNKNOWN    = 0;
  ADMIN_AFTER_SALE_STATUS_PENDING    = 10; // 待审核
  ADMIN_AFTER_SALE_STATUS_RETURNING  = 20; // 待商家收货
  ADMIN_AFTER_SALE_STATUS_REFUNDING  = 30; // 退款中
  ADMIN_AFTER_SALE_STATUS_COMPLETED  = 40; // 售后完成
  ADMIN_AFTER_SALE_STATUS_REFUSED    = 50; // 审核拒绝
  ADMIN_AFTER_SALE_STATUS_CANCELED   = 60; // 用户取消售后
}

// 售后类型
enum AdminAfterSaleType {
  ADMIN_AFTER_SALE_TYPE_UNKNOWN       = 0;
  ADMIN_AFTER_SALE_TYPE_REFUND_ONLY   = 1; // 仅退款
  ADMIN_AFTER_SALE_TYPE_RETURN_REFUND = 2; // 退货退款
}

// 售后审核动作
enum AfterSaleAuditAction {
  AFTER_SALE_AUDIT_ACTION_UNKNOWN = 0;
  AFTER_SALE_AUDIT_ACTION_APPROVE = 1; // 同意
  AFTER_SALE_AUDIT_ACTION_REJECT  = 2; // 拒绝
}

// 支付方式
enum AdminPayType {
  ADMIN_PAY_TYPE_UNKNOWN  = 0;
  ADMIN_PAY_TYPE_WECHAT   = 1; // 微信支付
  ADMIN_PAY_TYPE_ALIPAY   = 2; // 支付宝支付
}

// 优惠券类型
enum AdminCouponType {
  ADMIN_COUPON_TYPE_UNKNOWN       = 0;
  ADMIN_COUPON_TYPE_FULL_REDUCTION = 1; // 满减券
  ADMIN_COUPON_TYPE_DISCOUNT      = 2; // 折扣券
  ADMIN_COUPON_TYPE_NO_THRESHOLD  = 3; // 无门槛券
}

// 运费模板计费类型
enum FreightCalcType {
  FREIGHT_CALC_TYPE_UNKNOWN  = 0;
  FREIGHT_CALC_TYPE_PIECE    = 1; // 按件数
  FREIGHT_CALC_TYPE_WEIGHT   = 2; // 按重量
}


// =============================================
// RPC 服务定义
// =============================================

// ==================== Admin ====================
// 管理员自身管理（登录、管理员CRUD、角色、权限、日志查询）
service Admin {
  // 登录认证
  rpc AdminLogin(AdminLoginReq) returns (AdminLoginResp);
  rpc GetCurrentAdmin(GetCurrentAdminReq) returns (GetCurrentAdminResp);
  rpc UpdatePassword(UpdatePasswordReq) returns (Empty);

  // 管理员 CRUD
  rpc CreateAdmin(CreateAdminReq) returns (IdResp);
  rpc UpdateAdmin(UpdateAdminReq) returns (Empty);
  rpc DeleteAdmin(DeleteAdminReq) returns (Empty);
  rpc GetAdmin(GetAdminReq) returns (GetAdminResp);
  rpc ListAdmin(ListAdminReq) returns (ListAdminResp);

  // 角色管理
  rpc CreateRole(CreateRoleReq) returns (IdResp);
  rpc UpdateRole(UpdateRoleReq) returns (Empty);
  rpc DeleteRole(DeleteRoleReq) returns (Empty);
  rpc GetRole(GetRoleReq) returns (GetRoleResp);
  rpc ListRole(ListRoleReq) returns (ListRoleResp);

  // 权限管理
  rpc CreatePermission(CreatePermissionReq) returns (IdResp);
  rpc UpdatePermission(UpdatePermissionReq) returns (Empty);
  rpc DeletePermission(DeletePermissionReq) returns (Empty);
  rpc ListPermission(ListPermissionReq) returns (ListPermissionResp);

  // 角色权限
  rpc AssignRolePermissions(AssignRolePermissionsReq) returns (Empty);
  rpc GetRolePermissions(GetRolePermissionsReq) returns (GetRolePermissionsResp);

  // 操作日志
  rpc ListAdminLog(ListAdminLogReq) returns (ListAdminLogResp);
}

// ==================== AdminInternal ====================
// 内部服务（供其他服务调用）
service AdminInternal {
  // 创建管理员操作日志
  rpc CreateAdminLog(CreateAdminLogReq) returns (Empty);
}

// ==================== AdminUser ====================
// 用户管理（聚合 UserRpc）
service AdminUser {
  rpc ListUsers(AdminListUsersReq) returns (AdminListUsersResp);
  rpc GetUserDetail(AdminGetUserDetailReq) returns (AdminGetUserDetailResp);
  rpc BanUser(AdminBanUserReq) returns (Empty);
  rpc UnbanUser(AdminUnbanUserReq) returns (Empty);
}

// ==================== AdminProduct ====================
// 商品管理（聚合 ProductRpc）
service AdminProduct {
  // 分类管理
  rpc CategoryTree(Empty) returns (AdminCategoryTreeResp);
  rpc CreateCategory(AdminCreateCategoryReq) returns (IdResp);
  rpc UpdateCategory(AdminUpdateCategoryReq) returns (Empty);
  rpc DeleteCategory(IdReq) returns (Empty);

  // 商品管理（SPU + SKU 一起创建）
  rpc CreateProduct(AdminCreateProductReq) returns (IdResp);
  rpc UpdateProduct(AdminUpdateProductReq) returns (Empty);
  rpc DeleteProduct(IdReq) returns (Empty);
  rpc GetProduct(IdReq) returns (AdminProductDetailResp);
  rpc ListProducts(AdminListProductsReq) returns (AdminListProductsResp);
  rpc UpdateProductStatus(AdminUpdateProductStatusReq) returns (Empty);

  // SKU 管理
  rpc CreateSku(AdminCreateSkuReq) returns (IdResp);
  rpc UpdateSku(AdminUpdateSkuReq) returns (Empty);
  rpc DeleteSku(IdReq) returns (Empty);
  rpc ListSkusByProduct(AdminListSkusReq) returns (AdminListSkusResp);

  // 运费模板管理
  rpc CreateFreightTemplate(AdminCreateFreightTemplateReq) returns (IdResp);
  rpc UpdateFreightTemplate(AdminUpdateFreightTemplateReq) returns (Empty);
  rpc DeleteFreightTemplate(IdReq) returns (Empty);
  rpc ListFreightTemplates(AdminPageReq) returns (AdminListFreightTemplatesResp);
  rpc GetFreightTemplate(IdReq) returns (AdminFreightTemplateInfo);

  // 库存管理
  rpc AdjustStock(AdminAdjustStockReq) returns (AdminStockChangeResp);
  rpc ListStockLogs(AdminListStockLogsReq) returns (AdminListStockLogsResp);
}

// ==================== AdminOrder ====================
// 订单管理（聚合 OrderRpc）
service AdminOrder {
  rpc ListOrders(AdminListOrdersReq) returns (AdminListOrdersResp);
  rpc GetOrder(AdminGetOrderReq) returns (AdminOrderDetailResp);
  rpc ShipOrder(AdminShipOrderReq) returns (Empty);
}

// ==================== AdminAfterSale ====================
// 售后管理（聚合 OrderRpc）
service AdminAfterSale {
  rpc ListAfterSales(AdminListAfterSalesReq) returns (AdminListAfterSalesResp);
  rpc GetAfterSale(AdminGetAfterSaleReq) returns (AdminAfterSaleDetailResp);
  rpc HandleAfterSale(AdminHandleAfterSaleReq) returns (Empty);
}

// ==================== AdminCoupon ====================
// 优惠券管理（聚合 MarketingRpc，预留）
service AdminCoupon {
  rpc CreateCoupon(AdminCreateCouponReq) returns (IdResp);
  rpc UpdateCoupon(AdminUpdateCouponReq) returns (Empty);
  rpc UpdateCouponStatus(AdminUpdateCouponStatusReq) returns (Empty);
  rpc ListCoupons(AdminListCouponsReq) returns (AdminListCouponsResp);
}


// =============================================
// 通用结构
// =============================================

message Empty {}

message IdReq {
  uint64 id = 1;
}

message IdResp {
  uint64 id = 1;
}

message AdminPageReq {
  int64 page = 1;
  int64 page_size = 2;
}


// =============================================
// 管理员
// =============================================

message AdminInfo {
  uint64 id = 1;
  string username = 2;
  string real_name = 3;
  string avatar = 4;
  uint64 role_id = 5;
  string role_name = 6;
  AdminStatus status = 7;
  string created_at = 8;
}

message AdminLoginReq {
  string username = 1;
  string password = 2;
  string login_ip = 3;
}

message AdminLoginResp {
  uint64 admin_id = 1;
  string token = 2;
  int64 expire_time = 3;
}

message GetCurrentAdminReq {
  uint64 admin_id = 1;
}

message GetCurrentAdminResp {
  AdminInfo admin = 1;
  repeated string permissions = 2;
}

message UpdatePasswordReq {
  uint64 admin_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message CreateAdminReq {
  string username = 1;
  string password = 2;
  string real_name = 3;
  string avatar = 4;
  uint64 role_id = 5;
}

message UpdateAdminReq {
  uint64 id = 1;
  string real_name = 2;
  string avatar = 3;
  uint64 role_id = 4;
  AdminStatus status = 5;
}

message DeleteAdminReq {
  uint64 id = 1;
}

message GetAdminReq {
  uint64 id = 1;
}

message GetAdminResp {
  AdminInfo admin = 1;
}

message ListAdminReq {
  int64 page = 1;
  int64 page_size = 2;
  string username = 3;
  AdminStatus status = 4;
}

message ListAdminResp {
  int64 total = 1;
  repeated AdminInfo list = 2;
}


// =============================================
// 角色
// =============================================

message RoleInfo {
  uint64 id = 1;
  string name = 2;
  string code = 3;
  string remark = 4;
  string created_at = 5;
}

message CreateRoleReq {
  string name = 1;
  string code = 2;
  string remark = 3;
}

message UpdateRoleReq {
  uint64 id = 1;
  string name = 2;
  string code = 3;
  string remark = 4;
}

message DeleteRoleReq {
  uint64 id = 1;
}

message GetRoleReq {
  uint64 id = 1;
}

message GetRoleResp {
  RoleInfo role = 1;
}

message ListRoleReq {}

message ListRoleResp {
  repeated RoleInfo list = 1;
}


// =============================================
// 权限
// =============================================

message PermissionInfo {
  uint64 id = 1;
  string name = 2;
  string code = 3;
  string module = 4;
}

message CreatePermissionReq {
  string name = 1;
  string code = 2;
  string module = 3;
}

message UpdatePermissionReq {
  uint64 id = 1;
  string name = 2;
  string code = 3;
  string module = 4;
}

message DeletePermissionReq {
  uint64 id = 1;
}

message ListPermissionReq {}

message ListPermissionResp {
  repeated PermissionInfo list = 1;
}


// =============================================
// 角色权限
// =============================================

message AssignRolePermissionsReq {
  uint64 role_id = 1;
  repeated uint64 permission_ids = 2;
}

message GetRolePermissionsReq {
  uint64 role_id = 1;
}

message GetRolePermissionsResp {
  repeated uint64 permission_ids = 1;
  repeated string permission_codes = 2;
}


// =============================================
// 管理员操作日志
// =============================================

message AdminLogInfo {
  uint64 id = 1;
  uint64 admin_id = 2;
  string username = 3;
  LogModule module = 4;
  string action = 5;
  string request_method = 6;
  string request_url = 7;
  string request_params = 8;
  string response_result = 9;
  string ip = 10;
  int64 duration_ms = 11;
  string created_at = 12;
}

message CreateAdminLogReq {
  uint64 admin_id = 1;
  string username = 2;
  LogModule module = 3;
  string action = 4;
  string request_method = 5;
  string request_url = 6;
  string request_params = 7;
  string response_result = 8;
  string ip = 9;
  int64 duration_ms = 10;
}

message ListAdminLogReq {
  int64 page = 1;
  int64 page_size = 2;
  uint64 admin_id = 3;
  LogModule module = 4;
}

message ListAdminLogResp {
  int64 total = 1;
  repeated AdminLogInfo list = 2;
}


