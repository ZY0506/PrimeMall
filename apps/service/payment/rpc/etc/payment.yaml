Name: payment.rpc
ListenOn: 0.0.0.0:8084
Mode: dev

Etcd:
  Hosts:
    - ${ETCD_HOST}:${ETCD_PORT}
  Key: payment.rpc

DB:
  DSN: ${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/shop_payment?charset=utf8mb4&parseTime=True&loc=Local
  MaxIdleConns: 50
  MaxOpenConns: 100

RDB:
  Addr: ${REDIS_HOST}:${REDIS_PORT}
  RedisPassword: "${REDIS_PASSWORD}"
  RedisDB: 0
  RedisPoolSize: 50
  RedisMinIdleConns: 10

Snowflake:
  NodeID: 4

OrderRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}:${ETCD_PORT}
    Key: order.rpc
  Timeout: 5000

RabbitMQ:
  URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}${RABBITMQ_VHOST:-/}
