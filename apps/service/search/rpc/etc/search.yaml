Name: search.rpc
ListenOn: 0.0.0.0:8086

Etcd:
  Hosts:
    - ${ETCD_HOST}:${ETCD_PORT}
  Key: search.rpc

DB:
  DSN: ${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/shop_search?charset=utf8mb4&parseTime=True&loc=Local
  MaxIdleConns: 10
  MaxOpenConns: 10

Elasticsearch:
  Addresses:
    - http://${ES_HOST:-localhost}:${ES_PORT:-19200}
  Username: ""
  Password: ""
