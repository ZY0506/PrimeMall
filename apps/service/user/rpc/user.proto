syntax = "proto3";
import "google/protobuf/timestamp.proto";

// goctl rpc protoc .\apps\service\user\rpc\user.proto --go_out=apps/service/user/rpc/types --go-grpc_out apps/service/user/rpc/types --zrpc_out=apps/service/user/rpc/ -m

package user;
option go_package = "./user";

// 用户服务（面向客户端）
service User {
  // Captcha 获取短信验证码
  rpc Captcha(CaptchaReq) returns (EmptyResp);
  // Login 手机号密码登录
  rpc Login(LoginReq) returns (LoginResp);
  // MobileLogin 手机号验证码登录
  rpc MobileLogin(MobileLoginReq) returns (LoginResp);
  // Register 用户注册
  rpc Register(RegisterReq) returns (LoginResp);
  // ResetPassword 忘记密码重置
  rpc ResetPassword(ResetPasswordReq) returns (EmptyResp);
  // UpdatePassword 修改登录密码（已登录）
  rpc UpdatePassword(UpdatePasswordReq) returns (EmptyResp);
  // UpdatePhone 修改手机号
  rpc UpdatePhone(UpdatePhoneReq) returns (EmptyResp);
  // GetUserInfo 获取个人资料
  rpc GetUserInfo(EmptyReq) returns (UserInfoResp);
  // UpdateUserInfo 更新个人资料
  rpc UpdateUserInfo(UpdateUserInfoReq) returns (EmptyResp);
  // DeleteAccount 注销账号
  rpc DeleteAccount(DeleteAccountReq) returns (EmptyResp);
  // Logout 退出登录
  rpc Logout(LogoutReq) returns (EmptyResp);
  // RefreshToken token刷新
  rpc RefreshToken(RefreshTokenReq) returns (LoginResp);
  // GetOssToken 获取OSS上传凭证
  rpc GetOssToken(OssTokenReq) returns (OssTokenResp);

  // AddAddress 添加收货地址
  rpc AddAddress(AddAddressReq) returns (EmptyResp);
  // UpdateAddress 更新收货地址
  rpc UpdateAddress(AddressItem) returns (EmptyResp);
  // ListAddress 获取地址列表
  rpc ListAddress(AddressListReq) returns (AddressListResp);
  // SetDefaultAddress 设置默认地址
  rpc SetDefaultAddress(IdPathReq) returns (EmptyResp);
  // DeleteAddress 删除收货地址
  rpc DeleteAddress(IdPathReq) returns (EmptyResp);
}

// 内部服务（供其他服务调用）
service UserInternal {
  // GetUserById 根据用户ID获取用户基本信息（用于订单、购物车等）
  rpc GetUserById(GetUserByIdReq) returns (UserBasicInfo);
  // CheckUserStatus 校验用户状态（是否被封禁/限制下单）
  rpc CheckUserStatus(CheckUserStatusReq) returns (CheckUserStatusResp);
  // GetAddressById 获取地址信息
  rpc GetAddressById(GetAddressReq) returns (AddressItem);
}

// ------------------------------ 新增：管理员服务 ------------------------------
service Admin {
  // ListUsers 获取用户列表（分页、筛选、搜索）
  rpc ListUsers(ListUsersReq) returns (ListUsersResp);
  // GetUserDetail 获取用户详情（含扩展信息、最近登录、处罚记录）
  rpc GetUserDetail(GetUserDetailReq) returns (GetUserDetailResp);
  // BanUser 封禁用户（限制下单/封禁账号）
  rpc BanUser(BanUserReq) returns (EmptyResp);
  // UnbanUser 解封用户（恢复为正常状态）
  rpc UnbanUser(UnbanUserReq) returns (EmptyResp);
  // GetUserStatistics 获取用户统计数据
  rpc GetUserStatistics(GetUserStatisticsReq) returns (GetUserStatisticsResp);
  // ListLoginLogs 获取登录日志列表
  rpc ListLoginLogs(ListLoginLogsReq) returns (ListLoginLogsResp);
  // ListPunishLogs 获取风控处罚日志列表
  rpc ListPunishLogs(ListPunishLogsReq) returns (ListPunishLogsResp);
  // AdminResetPassword 重置用户密码（管理员强制重置）
  rpc AdminResetPassword(AdminResetPasswordReq) returns (EmptyResp);
}

// ------------------------------ 新增：管理员相关消息 ------------------------------

// 用户列表请求
message ListUsersReq {
  int64 page = 1;              // 页码（从1开始）
  int64 size = 2;              // 每页条数
  string phone = 3;            // 按手机号模糊搜索
  string nickname = 4;         // 按昵称模糊搜索
  UserStatus status = 5;       // 按状态筛选（0-未知表示不过滤）
  google.protobuf.Timestamp start_time = 6;  // 注册开始时间
  google.protobuf.Timestamp end_time = 7;    // 注册结束时间
  SortField sort_field = 8;       // 排序字段（id, created_at, last_login_time）
  SortOrder sort_order = 9;       // 排序方向（asc, desc）
}

// 用户列表项（管理员视角）
message UserListItem {
  uint64 id = 1;
  string phone = 2;
  string nickname = 3;
  string avatar = 4;
  int64 gender = 5;            // 0-未知，1-男，2-女
  google.protobuf.Timestamp birthday = 6;
  UserStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_login_time = 9;
  string last_login_ip = 10;
}

// 用户列表响应
message ListUsersResp {
  repeated UserListItem list = 1;
  int64 total = 2;
}

// 用户详情请求
message GetUserDetailReq {
  uint64 user_id = 1;
}

// 用户详情响应（含扩展信息、最近登录日志、处罚记录）
message GetUserDetailResp {
  UserListItem user_info = 1;                       // 基本信息
  repeated LoginLogItem recent_login_logs = 2;      // 最近5条登录日志
  repeated PunishLogItem punish_logs = 3;           // 历史处罚记录
}

// 封禁请求
message BanUserReq {
  uint64 user_id = 1;
  string action_type = 2;      // BAN_ORDER-限制下单，BAN_LOGIN-封禁账号
  string reason = 3;           // 封禁原因
  google.protobuf.Timestamp end_time = 4;  // 处罚结束时间（可为空，表示永久）
  string operator = 5;         // 操作人（管理员账号）
}

// 解封请求
message UnbanUserReq {
  uint64 user_id = 1;
  string reason = 2;           // 解封原因
  string operator = 3;         // 操作人
}

// 获取统计数据请求
message GetUserStatisticsReq {
  google.protobuf.Timestamp start_time = 1;  // 统计开始时间（可选）
  google.protobuf.Timestamp end_time = 2;    // 统计结束时间（可选）
}

// 统计数据响应
message GetUserStatisticsResp {
  int64 total_users = 1;                    // 总用户数
  int64 today_new_users = 2;                // 今日新增
  int64 week_new_users = 3;                 // 本周新增（自然周）
  int64 month_new_users = 4;                // 本月新增
  int64 active_users_today = 5;             // 今日活跃（有登录）
  int64 banned_users = 6;                   // 被封禁用户数（status=3）
  int64 restricted_users = 7;               // 限制下单用户数（status=2）
  repeated DailyStat daily_stats = 8;       // 按日统计（用于图表）
}

// 每日统计数据
message DailyStat {
  string date = 1;                          // 日期 YYYY-MM-DD
  int64 new_users = 2;                      // 当日新增
  int64 login_users = 3;                    // 当日登录用户数
}

// 登录日志列表请求
message ListLoginLogsReq {
  int64 page = 1;
  int64 size = 2;
  uint64 user_id = 3;                       // 可选，筛选指定用户
  string login_type = 4;                    // 可选，筛选登录方式（password/captcha）
  int64 status = 5;                         // 可选，筛选状态（1-成功，2-失败）
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
}

// 登录日志项
message LoginLogItem {
  uint64 id = 1;
  uint64 user_id = 2;
  string login_type = 3;
  string login_ip = 4;
  string user_agent = 5;
  int64 status = 6;                         // 1-成功，2-失败
  string fail_reason = 7;
  google.protobuf.Timestamp created_at = 8;
}

// 登录日志列表响应
message ListLoginLogsResp {
  repeated LoginLogItem list = 1;
  int64 total = 2;
}

// 风控日志列表请求
message ListPunishLogsReq {
  int64 page = 1;
  int64 size = 2;
  uint64 user_id = 3;                       // 可选
  string action_type = 4;                   // 可选（BAN_LOGIN/BAN_ORDER）
  string operator = 5;                      // 可选（SYSTEM/ADMIN）
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
}

// 风控日志项
message PunishLogItem {
  uint64 id = 1;
  uint64 user_id = 2;
  string phone = 3;
  string action_type = 4;
  string reason = 5;
  string operator = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  google.protobuf.Timestamp created_at = 9;
}

// 风控日志列表响应
message ListPunishLogsResp {
  repeated PunishLogItem list = 1;
  int64 total = 2;
}

// 管理员重置密码请求
message AdminResetPasswordReq {
  uint64 user_id = 1;
  string new_password = 2;                  // 新密码（明文，后端需加盐加密）
  string operator = 3;
}

// ------------------------------ 以下为原有消息（保持不变） ------------------------------
message EmptyReq {}
message EmptyResp {}
message ErrDetail{
  int32 code = 1;
  string msg = 2;
}
// ------------------------------ 枚举 ------------------------------
enum UserStatus {
  USER_STATUS_UNKNOWN = 0;    // 未知
  USER_STATUS_NORMAL = 1;     // 正常
  USER_STATUS_RESTRICTED = 2; // 限制下单
  USER_STATUS_BANNED = 3;     // 封禁
}

// 排序字段枚举
enum SortField {
  SORT_FIELD_UNKNOWN = 0;   // 未知，服务端可回退默认排序（如 id desc）
  SORT_FIELD_ID = 1;
  SORT_FIELD_CREATED_AT = 2;
  SORT_FIELD_LAST_LOGIN_TIME = 3;
}

// 排序方向枚举
enum SortOrder {
  SORT_ORDER_UNKNOWN = 0;   // 未知，服务端默认降序
  SORT_ORDER_ASC = 1;       // 升序
  SORT_ORDER_DESC = 2;      // 降序
}

// 通用ID路径参数
message IdPathReq {
  uint64 id = 1;
}

// ------------------------------ 认证相关 ------------------------------
message CaptchaReq {
  string phone = 1;
  string scene = 2;  // login, register, reset_pwd, update_pwd, update_phone
  string idempotency_key = 6;
}

message LoginReq {
  string phone = 1;
  string password = 2;
}

message MobileLoginReq {
  string phone = 1;
  string code = 2;
}

message RegisterReq {
  string phone = 1;
  string password = 2;
  string confirm_password = 3;
  string code = 4;
  string nickname = 5;
  string idempotency_key = 6;
}

message ResetPasswordReq {
  string phone = 1;
  string code = 2;
  string new_password = 3;
  string idempotency_key = 4;
}

message LogoutReq {
  string access_jti = 1;
  string refresh_jti = 2;
}

message RefreshTokenReq{
  string refresh_jti = 1;
}

message UpdatePasswordReq {
  string old_password = 1;
  string new_password = 2;
  string confirm_password = 3;
}

message UpdatePhoneReq {
  string old_phone_code = 1;      // 原手机验证码（已登录时可选）
  string new_phone = 2;
  string new_phone_code = 3;
  string idempotency_key = 4;
}

message DeleteAccountReq {
  string password = 1;            // 密码验证
  string access_jti = 2;
  string refresh_jti = 3;
}

message LoginResp {
  string access_token = 1;
  google.protobuf.Timestamp access_expire = 2;       // RFC3339格式
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_expire = 4;
}

// ------------------------------ 用户资料 ------------------------------
message UserInfoResp {
  uint64 id = 1;
  string phone = 2;
  string nickname = 3;
  string avatar = 4;
  int64 gender = 5;               // 0-未知，1-男，2-女
  google.protobuf.Timestamp birthday = 6;            // RFC3339日期格式 2006-01-02
  UserStatus status = 7;          // 1-正常，2-限制下单，3-封禁
  string status_desc = 8;
}

message UpdateUserInfoReq {
  string nickname = 1;
  string avatar = 2;
  int64 gender = 3;
  google.protobuf.Timestamp birthday = 4;
}

// ------------------------------ OSS上传 ------------------------------
message OssTokenReq {
  string file_name = 1;           // 原始文件名（用于提取扩展名）
}

message OssTokenResp {
  string access_id = 1;
  string host = 2;
  string policy = 3;
  string signature = 4;
  google.protobuf.Timestamp expire = 5;              // RFC3339格式
  string dir = 6;                 // OSS存储目录（avatar/）
  string object_key = 7;          // OSS存储对象名
  string callback = 8;          // 回调
}

// ------------------------------ 地址管理 ------------------------------
message AddressDetail {
  string province = 1;
  string city = 2;
  string district = 3;
  string detail = 4;
  string postal_code = 5;
}
message AddAddressReq {
  string receiver_name = 2;
  string receiver_phone = 3;
  AddressDetail address = 4;      // 地址详情
  int64 is_default = 5;           // 0-否，1-是
  string tag = 6;                 // HOME, OFFICE, SCHOOL
}
message AddressItem {
  uint64 id = 1;
  string receiver_name = 2;
  string receiver_phone = 3;
  AddressDetail address = 4;      // 地址详情
  int64 is_default = 5;           // 0-否，1-是
  string tag = 6;                 // HOME, OFFICE, SCHOOL
}
message AddressListReq {
  int64 page = 1;  // 可选
  int64 size = 2;  // 可选
}
message AddressListResp {
  repeated AddressItem list = 1;
  int64 total = 2;
}

// ------------------------------ 内部服务消息 ------------------------------
message GetUserByIdReq {
  uint64 user_id = 1;
}

message UserBasicInfo {
  uint64 id = 1;
  string phone = 2;
  string nickname = 3;
  string avatar = 4;
  UserStatus status = 5;               // 1-正常，2-限制下单，3-封禁
}

message BatchGetUserByIdReq {
  repeated uint64 user_ids = 1;
}

message BatchUserBasicInfoResp {
  map<uint64, UserBasicInfo> users = 1;
}

message CheckUserStatusReq {
  uint64 user_id = 1;
  // 需要检查的权限类型：2-下单权限，3-登录权限
  int64 check_type = 2;
}

message CheckUserStatusResp {
  bool allowed = 1;               // 是否允许操作
  string reason = 2;              // 禁止原因
}

message GetAddressReq {
  uint64 address_id = 1;
  uint64 user_id = 2;
}