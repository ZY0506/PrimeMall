syntax = "proto3";
package product;

option go_package = "./product";

// goctl rpc protoc .\apps\service\product\rpc\product.proto --go_out=apps/service/product/rpc/types --go-grpc_out apps/service/product/rpc/types --zrpc_out=apps/service/product/rpc/ -m

// ==================== RPC（对外/公共） ====================
service Product {
  // 分类
  rpc CategoryTree(Empty) returns (CategoryTreeResp);
  rpc CategoryInfo(IdReq) returns (CategoryResp);

  // 商品
  rpc ListProducts(ProductListReq) returns (ProductListResp);
  rpc ProductDetail(IdReq) returns (ProductDetailResp);

  // 推荐（后续可拆服务）
  rpc Recommend(RecommendReq) returns (ProductListResp);

  // SKU
  rpc BatchGetSkus(SkuIdsReq) returns (BatchSkuResp);
}

// ==================== RPC（管理后台） ====================
service ProductAdmin {
  // 分类管理
  rpc CreateCategory(CreateCategoryReq) returns (Empty);
  rpc UpdateCategory(UpdateCategoryReq) returns (Empty);
  rpc DeleteCategory(IdReq) returns (Empty);
  rpc ListCategories(ListCategoriesReq) returns (ListCategoriesResp);
  rpc TreeCategories(Empty) returns (CategoryTreeResp);

  // 商品管理（SPU + SKU 一起创建/更新，全量提交 SKU）
  rpc CreateProduct(CreateProductReq) returns (Empty);
  rpc UpdateProduct(UpdateProductReq) returns (Empty);
  rpc DeleteProduct(IdReq) returns (Empty);
  rpc ListProductsAdmin(ListProductsAdminReq) returns (ListProductsAdminResp);
  rpc GetProductAdmin(IdReq) returns (ProductDetailResp);
  rpc UpdateProductStatus(UpdateProductStatusReq) returns (Empty);

  // 运费模板管理
  rpc CreateFreightTemplate(CreateFreightTemplateReq) returns (Empty);
  rpc UpdateFreightTemplate(UpdateFreightTemplateReq) returns (Empty);
  rpc DeleteFreightTemplate(IdReq) returns (Empty);
  rpc ListFreightTemplates(PageReq) returns (ListFreightTemplatesResp);
  rpc GetFreightTemplate(IdReq) returns (FreightTemplate);

  // 库存管理（管理员手动调整）
  rpc AdjustStock(AdjustStockReq) returns (StockChangeResp);
  rpc ListStockLogs(ListStockLogsReq) returns (ListStockLogsResp);
}

// ==================== RPC（内部服务调用） ====================
service ProductInternal {
  // 锁定库存（下单预占）
  rpc LockStock(UpdateStockReq) returns (StockChangeResp);
  // 解锁库存（超时未支付）
  rpc UnlockStock(UpdateStockReq) returns (StockChangeResp);
  // 扣减库存（支付成功）
  rpc DeductStock(UpdateStockReq) returns (StockChangeResp);
  // 回滚库存（订单取消/退款）
  rpc RollbackStock(UpdateStockReq) returns (StockChangeResp);
  // 回滚库存（订单取消/退款）
  rpc RevertDeductStock(UpdateStockReq) returns (StockChangeResp);
  // 批量查询库存（订单服务校验，返回可用库存）
  rpc BatchGetStock(SkuIdsReq) returns (BatchStockResp);
  // 批量获取Sku
  rpc GetSkuListByIds(SkuIdsReq) returns (SkuListResp);
  // 计算运费
  rpc CalculateFreight(CalculateFreightReq) returns (CalculatePriceResp);
}

// ==================== 通用结构 ====================
message Empty{}

message IdReq {
  uint64 id = 1;
}

message PageReq {
  int64 page = 1; // 默认1
  int64 size = 2; // 默认10
}

message PageResp {
  int64 total = 1;
  int64 page = 2;
  int64 size = 3;
}

message SkuIdsReq {
  repeated uint64 sku_ids = 1;
}

// ==================== 枚举定义 ====================
enum ProductStatus {
  PRODUCT_STATUS_UNKNOWN = 0;
  PRODUCT_STATUS_ON_SALE = 1;
  PRODUCT_STATUS_OFF_SALE = 2;
}

enum RecommendScene {
  SCENE_UNKNOWN = 0;
  SCENE_HOME = 1;
  SCENE_CART = 2;
  SCENE_DETAIL = 3;
}

// 库存操作类型（与 stock_log.change_type 对应）
enum StockOpType {
  STOCK_OP_UNKNOWN = 0;
  STOCK_OP_LOCK = 1;     // 预扣库存（下单锁定）
  STOCK_OP_UNLOCK = 2;   // 回滚/解锁（取消订单超时解锁）
  STOCK_OP_DEDUCT = 3;   // 实际扣减（支付成功）
  STOCK_OP_RETURN = 4;   // 退货加回
  STOCK_OP_ADMIN = 5;    // 管理员调整
}

// ==================== 分类 ====================
message Category {
  uint64 id = 1;
  uint64 parent_id = 2;
  string name = 3;
  string icon = 4;
  int64 sort = 5;
  int64 level = 6;
  int64 status = 7;            // 1-启用 2-禁用
  repeated Category children = 8;
}

message CategoryTreeResp {
  repeated Category list = 1;
}

message CategoryResp {
  Category category = 1;
}

message ListCategoriesReq {
  uint64 parent_id = 1;
  PageReq page = 2;
}

message ListCategoriesResp {
  PageResp page = 1;
  repeated Category list = 2;
}

message CreateCategoryReq {
  uint64 parent_id = 1;
  string name = 2;
  string icon = 3;
  int64 sort = 4;
}

message UpdateCategoryReq {
  uint64 id = 1;
  string name = 2;
  string icon = 3;
  int64 sort = 4;
  int64 status = 5;
}

// ==================== 商品筛选 ====================
message AttrFilter {
  string name = 1;
  repeated string values = 2;
}

// 前台商品列表请求
message ProductListReq {
  uint64 category_id = 1;
  string keyword = 2;
  string brand = 3;
  int64 min_price = 4;
  int64 max_price = 5;
  repeated AttrFilter attrs = 6;
  bool is_new = 7;
  string sort_by = 8;
  string sort_type = 9;
  PageReq page = 10;
}

// 后台商品列表请求
message ListProductsAdminReq {
  uint64 category_id = 1;
  string keyword = 2;
  string brand = 3;
  ProductStatus status = 4;
  int64 min_price = 5;
  int64 max_price = 6;
  string sort_by = 7;      // created_at, price, sales
  string sort_type = 8;    // asc, desc
  PageReq page = 9;
}

// 后台商品列表项
message ProductAdminItem {
  uint64 id = 1;
  string name = 2;
  string brand = 3;
  string cover = 4;            // main_pic
  int64 price = 5;             // 最低售价
  int64 sales_count = 6;       // 实际销量
  ProductStatus status = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message ListProductsAdminResp {
  PageResp page = 1;
  repeated ProductAdminItem list = 2;
}

// 创建商品请求（SPU）
message CreateProductReq {
  uint64 category_id = 1;
  string name = 2;
  string brand = 3;
  string description = 4;      // 简短描述
  string content = 5;          // 详情HTML
  string cover = 6;            // 主图
  repeated string images = 7;  // 副图列表
  string video_url = 8;
  uint64 freight_template_id = 9;
  repeated AttributeItem attributes = 10; // 扩展属性（非表字段）
  repeated SkuItem skus = 11;             // SKU列表
}

// 更新商品请求（SPU + SKU 全量更新）
message UpdateProductReq {
  uint64 id = 1;
  uint64 category_id = 2;
  string name = 3;
  string brand = 4;
  string description = 5;
  string content = 6;
  string cover = 7;
  repeated string images = 8;
  string video_url = 9;
  uint64 freight_template_id = 10;
  ProductStatus status = 11;
  repeated AttributeItem attributes = 12;
  repeated SkuItem skus = 13; // 全量 SKU 列表，用于替换原有 SKU
}

// 更新商品状态请求
message UpdateProductStatusReq {
  uint64 id = 1;
  ProductStatus status = 2;
}

// ==================== 商品列表项（前台） ====================
message ProductItem {
  uint64 id = 1;
  string name = 2;
  string brand = 3;
  string desc = 4;
  string cover = 5;
  int64 price = 6;        // 最低价（分）
  int64 sales = 7;        // 展示销量（虚拟+实际）
  int64 show_sales = 8;   // 同 sales，兼容旧版
}

message ProductListResp {
  PageResp page = 1;
  repeated ProductItem list = 2;
}

// ==================== SKU ====================
message SpecItem {
  string key = 1;
  string value = 2;
}

message SkuItem {
  uint64 id = 1;
  uint64 spu_id = 2;                  // 所属SPU ID
  string spu_name = 3;
  string sku_code = 4;                // SKU编码（唯一）
  int64 price = 5;                    // 销售价（分）
  int64 market_price = 6;             // 市场价（分）
  int64 cost_price = 7;               // 成本价（分）
  int64 stock = 8;                    // 物理库存总数（总库存）
  int64 locked_stock = 9;             // 锁定库存数量
  uint32 version = 10;                 // 乐观锁版本号
  repeated SpecItem specs = 11;       // 规格 JSON 结构化
  repeated string images = 12;        // SKU专属图片
  int64 weight = 13;                  // 重量（克）
  int64 status = 14;                  // 1-启用 2-禁用

  int64 spu_status = 15;              // spu状态 0-下架
}

message SkuSimple {
  uint64 id = 1;
  int64 price = 2;
  int64 stock = 3;        // 可用库存 = stock - locked_stock
}

// 创建SKU请求
message CreateSkuReq {
  uint64 spu_id = 1;
  string sku_code = 2;
  int64 price = 3;
  int64 market_price = 4;
  int64 cost_price = 5;
  int64 stock = 6;                // 初始物理库存
  repeated SpecItem specs = 7;
  repeated string images = 8;
  int64 weight = 9;
}

// 更新SKU请求
message UpdateSkuReq {
  uint64 id = 1;
  string sku_code = 2;
  int64 price = 3;
  int64 market_price = 4;
  int64 cost_price = 5;
  int64 stock = 6;               // 管理员调整物理库存时使用
  repeated SpecItem specs = 7;
  repeated string images = 8;
  int64 weight = 9;
  int64 status = 10;
  uint32 version = 11;           // 乐观锁版本
}

// 按商品ID查询SKU列表
message ListSkusByProductReq {
  uint64 spu_id = 1;
  PageReq page = 2;
}

message ListSkusResp {
  PageResp page = 1;
  repeated SkuItem list = 2;
}

// 批量获取SKU（前台）
message BatchSkuResp {
  repeated SkuSimple list = 1;
}

// ==================== 商品详情 ====================
message AttributeItem {
  string name = 1;
  repeated string values = 2;
}

message ProductDetailResp {
  uint64 id = 1;
  uint64 category_id = 2;
  string name = 3;
  string brand = 4;
  string description = 5;      // 简短描述
  string content = 6;          // 详情HTML
  string cover = 7;            // 主图
  repeated string images = 8;  // 副图
  string video_url = 9;
  int64 price = 10;            // 最低售价
  int64 sales = 11;            // 展示销量
  int64 show_sales = 12;
  ProductStatus status = 13;
  uint64 freight_template_id = 15;
  repeated SkuItem skus = 16;
  repeated AttributeItem attributes = 17;
  int64 sales_count = 18;      // 实际销量
  int64 virtual_sales = 19;    // 虚拟销量
}

// ==================== 推荐 ====================
message RecommendReq {
  RecommendScene scene = 1;
  uint64 current_id = 2;
  int64 limit = 3;
}

// ==================== 运费模板 ====================
message FreightTemplate {
  uint64 id = 1;
  string name = 2;
  int64 type = 3;                       // 1-按件数 2-按重量
  int64 default_fee = 4;                // 基础运费（分）
  int64 default_quantity = 5;           // 首件/首重数量
  int64 extra_fee = 6;                  // 续件/续重费用（分）
  int64 free_threshold_amount = 7;      // 满额包邮阈值（分），0表示不包邮
  int64 free_threshold_quantity = 8;    // 满件包邮阈值，0表示不包邮
  int64 is_default = 9;                 // 是否默认模板 0-否 1-是
  int64 status = 10;                    // 1-启用 2-禁用
  int64 created_at = 11;
  int64 updated_at = 12;
}

message CreateFreightTemplateReq {
  string name = 1;
  int64 type = 2;
  int64 default_fee = 3;
  int64 default_quantity = 4;
  int64 extra_fee = 5;
  int64 free_threshold_amount = 6;
  int64 free_threshold_quantity = 7;
  int64 is_default = 8;
}

message UpdateFreightTemplateReq {
  uint64 id = 1;
  string name = 2;
  int64 type = 3;
  int64 default_fee = 4;
  int64 default_quantity = 5;
  int64 extra_fee = 6;
  int64 free_threshold_amount = 7;
  int64 free_threshold_quantity = 8;
  int64 is_default = 9;
  int64 status = 10;
}

message ListFreightTemplatesResp {
  PageResp page = 1;
  repeated FreightTemplate list = 2;
}

// ==================== 库存日志 ====================
message StockLog {
  uint64 id = 1;
  uint64 sku_id = 2;
  string order_sn = 3;
  StockOpType change_type = 4;
  int64 quantity = 5;          // 变动数量（正负）
  int64 before_stock = 6;      // 变动前总库存
  int64 after_stock = 7;       // 变动后总库存
  string remark = 8;
  int64 created_at = 9;
}

message RecordStockLogReq {
  uint64 sku_id = 1;
  string order_sn = 2;
  StockOpType change_type = 3;
  int64 quantity = 4;
  int64 before_stock = 5;
  int64 after_stock = 6;
  string remark = 7;
  string operator = 8;         // 操作人（管理员调整时使用）
}

message ListStockLogsReq {
  uint64 sku_id = 1;           // 0 表示所有
  StockOpType change_type = 2; // 0 表示所有
  string order_sn = 3;
  string start_time = 4;       // 时间戳（秒）
  string end_time = 5;
  PageReq page = 6;
}

message ListStockLogsResp {
  PageResp page = 1;
  repeated StockLog list = 2;
}

// ==================== 内部库存操作 ====================
message SkuStockItem {
  uint64 sku_id = 1;
  int64 quantity = 2;   // 数量
}

message UpdateStockReq {
  repeated SkuStockItem items = 1;
  string order_sn = 2;
}

// 管理员调整库存
message AdjustStockReq {
  repeated SkuStockItem items = 1;
  string reason = 2;
  string operator = 3;
}

message CalculateFreightReq {
  uint64 address_id = 1;            // 地址ID（用于获取省市区）
  repeated SkuStockItem items = 2;   // 商品列表
}

message StockChangeResp {
  bool success = 1;
  repeated SkuStockResult results = 3;
}

message SkuStockResult {
  uint64 sku_id = 1;
  bool success = 2;
  string message = 3;
  int64 current_stock = 4;      // 变更后的物理库存
  int64 current_locked = 5;     // 变更后的锁定库存
}

message CalculatePriceResp{
  int64 total_price = 1;
}

message BatchStockResp {
  map<uint64, int64> stocks = 1; // sku_id -> 可用库存 (stock - locked_stock)
}

message SkuListResp{
  repeated SkuItem sku_items = 1;
}