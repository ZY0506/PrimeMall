syntax = "proto3";

package order;

option go_package = "./order";

import "google/protobuf/timestamp.proto";

// goctl rpc protoc .\apps\service\order\rpc\order.proto --go_out=apps/service/order/rpc/types --go-grpc_out apps/service/order/rpc/types --zrpc_out=apps/service/order/rpc/ -m

// ========================
// service
// ========================

service Order {
  // 预下单
  rpc PreOrder(PreOrderRequest) returns (PreOrderResponse);

  // 创建订单
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);

  // 订单
  rpc OrderList(OrderListRequest) returns (OrderListResponse);
  rpc OrderDetail(OrderDetailRequest) returns (OrderDetailResponse);

  // 操作
  rpc CancelOrder(OrderDetailRequest) returns (Empty);
  rpc ConfirmReceipt(OrderDetailRequest) returns (Empty);

  // 售后
  rpc ApplyAfterSale(AfterSaleRequest) returns (AfterSaleResponse);
}

// ========================
// 购物车服务（核心补充）
// ========================
service Cart {

  // 添加/更新商品（数量=0删除）
  rpc UpdateCart(UpdateCartRequest) returns (Empty);

  // 修改选中状态（单个商品）
  rpc SelectCart(SelectCartRequest) returns (Empty);

  // 批量修改选中状态（支持全选/全不选）
  rpc BatchSelectCart(BatchSelectCartRequest) returns (Empty);

  // 获取购物车列表
  rpc CartList(CartListRequest) returns (CartListResponse);

  // 批量删除
  rpc RemoveCart(RemoveCartRequest) returns (Empty);

  // 清空购物车
  rpc ClearCart(ClearCartRequest) returns (Empty);
}

service OrderAdmin{

}

service OrderInternal{

}

// ========================
// 枚举定义（非常关键）
// ========================

// 订单状态
enum OrderStatus {
  ORDER_STATUS_UNKNOWN = 0;
  ORDER_STATUS_PENDING_PAY = 10;   // 待支付
  ORDER_STATUS_PAID = 20;          // 已支付
  ORDER_STATUS_SHIPPED = 30;       // 已发货
  ORDER_STATUS_COMPLETED = 40;     // 已完成
  ORDER_STATUS_CANCELED = 50;      // 已取消
  ORDER_STATUS_AFTER_SALE = 60;    // 售后中
}

// 售后状态
enum AfterSaleStatus {
  AFTER_SALE_UNKNOWN = 0;
  AFTER_SALE_PENDING = 1;
  AFTER_SALE_RETURNING = 2;
  AFTER_SALE_REFUNDING = 3;
  AFTER_SALE_DONE = 4;
  AFTER_SALE_REJECTED = 5;
}

// 支付方式
enum PayType {
  PAY_TYPE_UNKNOWN = 0;
  PAY_TYPE_WECHAT = 1;   // 微信支付
  PAY_TYPE_ALIPAY = 2;   // 支付宝支付
}

// 售后类型
enum AfterSaleType {
  AFTER_SALE_TYPE_UNKNOWN = 0;
  AFTER_SALE_TYPE_REFUND_ONLY = 1;    // 仅退款
  AFTER_SALE_TYPE_RETURN_REFUND = 2;  // 退货退款
}

message Empty {}

// ========================
// 基础结构
// ========================

message AddressDetail {
  string province = 1;
  string city = 2;
  string district = 3;
  string detail_address = 4;
  string postal_code = 5;
}

message AddressSnapshot {
  string receiver_name = 1;
  string receiver_phone = 2;
  AddressDetail detail = 3;
}

// 商品项（下单）
message OrderItem {
  uint64 sku_id = 1;
  uint64 spu_id = 2;
  string product_name = 3;
  string sku_name = 4;
  string pic = 5;
  int64 price = 6;      // 分
  int64 quantity = 7;
  int64 total_amount = 8;
}

// ========================
// 预下单
// ========================
message PreOrderRequest {
  repeated OrderItemSimple items = 1;
  uint64 address_id = 2;
  uint64 coupon_id = 3;
}

message OrderItemSimple {
  uint64 sku_id = 1;
  int64 quantity = 2;
}

message PreOrderResponse {
  string settlement_token = 1;

  repeated OrderItem items = 2;
  AddressSnapshot address = 3;

  int64 total_amount = 4;
  int64 freight_amount = 5;
  int64 coupon_amount = 6;
  int64 pay_amount = 7;
}

// ========================
// 创建订单
// ========================

message CreateOrderRequest {
  string settlement_token = 1;
  uint64 address_id = 2;
  uint64 coupon_id = 3;

  PayType pay_type = 4;          // 改为枚举类型
  int64 pay_amount = 5;

  string remark = 6;
  string idempotency_key = 7;
}

message CreateOrderResponse {
  string order_sn = 1;
  int64 pay_amount = 2;
}

// ========================
// 订单
// ========================

message OrderListRequest {
  OrderStatus status = 1;
  int64 page = 2;
  int64 size = 3;
}

message OrderListItem {
  string order_sn = 1;
  OrderStatus status = 2;
  int64 pay_amount = 3;
  google.protobuf.Timestamp create_time = 4;   // 改为 Timestamp

  repeated OrderItem items = 5;
}

message OrderListResponse {
  int64 total = 1;
  repeated OrderListItem list = 2;
}

message OrderDetailRequest {
  string order_sn = 1;
}

message OrderDetailResponse {
  OrderListItem base = 1;

  AddressSnapshot address = 2;

  int64 freight_amount = 3;
  int64 coupon_amount = 4;

  string delivery_sn = 5;
  string delivery_corp = 6;

  google.protobuf.Timestamp expire_time = 7;   // 改为 Timestamp
  string remark = 8;
}

// ========================
// 售后
// ========================

message AfterSaleRequest {
  string order_sn = 1;
  uint64 sku_id = 2;
  int64 quantity = 3;

  AfterSaleType type = 4;        // 改为枚举类型
  string reason = 5;

  int64 apply_amount = 6;
  repeated string images = 7;

  string idempotency_key = 8;
}

message AfterSaleResponse {
  uint64 after_sale_id = 1;
  AfterSaleStatus status = 2;
  int64 apply_amount = 3;
  string audit_remark = 4;
  google.protobuf.Timestamp created_at = 5;   // 改为 Timestamp
}

message CartItem {
  uint64 id = 1;
  uint64 sku_id = 2;
  uint64 spu_id = 3;

  string product_name = 4;
  string sku_name = 5;
  string pic = 6;

  int64 price = 7;
  int64 quantity = 8;

  bool selected = 9;

  int64 stock = 10;
  int64 status = 11;
}

message UpdateCartRequest {
  uint64 user_id = 1;

  uint64 sku_id = 2;
  int64 quantity = 3;

  string idempotency_key = 4;
}

message SelectCartRequest {
  uint64 user_id = 1;

  uint64 sku_id = 2;
  bool selected = 3;
}

// 批量修改购物车选中状态（支持全选/全不选）
message BatchSelectCartRequest {
  uint64 user_id = 1;
  bool selected = 2;                // true: 选中, false: 取消选中
  bool all = 3;                     // true: 作用于购物车所有商品，忽略 sku_ids
  repeated uint64 sku_ids = 4;      // 当 all=false 时，仅修改这些 sku 的选中状态
}

message CartListRequest {
  uint64 user_id = 1;
}

message RemoveCartRequest {
  uint64 user_id = 1;
  repeated uint64 sku_ids = 2;
}

message ClearCartRequest {
  uint64 user_id = 1;
}

message CartListResponse {
  repeated CartItem items = 1;
  int64 total_amount = 2;
}