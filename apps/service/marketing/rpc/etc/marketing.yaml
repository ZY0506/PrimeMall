Name: marketing.rpc
ListenOn: 0.0.0.0:8085

Etcd:
  Hosts:
    - ${ETCD_HOST}:${ETCD_PORT}
  Key: marketing.rpc

DB:
  DSN: ${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/shop_marketing?charset=utf8mb4&parseTime=True&loc=Local
  MaxIdleConns: 10
  MaxOpenConns: 50

RDB:
  Addr: ${REDIS_HOST}:${REDIS_PORT}
  RedisPassword: "${REDIS_PASSWORD}"
  RedisDB: 0
  RedisPoolSize: 30
  RedisMinIdleConns: 5
